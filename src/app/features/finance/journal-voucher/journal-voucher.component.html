    <div class="container-fluid p-2">
      <div class="card">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <strong class="h5">
              Add Journal Voucher Information              
            </strong>
          </div>

          <div class="card-body">
            <div class="row">

              <!-- ================= LEFT FORM (DRAFT) ================= -->
              <div class="col-md-8">
                <form [formGroup]="jvForm" (ngSubmit)="onSaveJV()">                 
                    
                    <!-- Row 1: Voucher Date and Voucher Number -->
                    <div class="row mb-2">           
                        
                      <!-- Voucher Date -->
                      <div class="col-md-3">
                        <label class="fw-bold">
                          Voucher Date : <span class="text-danger">*</span>
                        </label>
                      </div>       

                      <div class="col-md-3">
                        <input type="date"
                            #voucherDate
                            (keydown.enter)="focusNext(sourceAccount); $event.preventDefault()"
                            class="form-control form-control-sm"
                            formControlName="voucherDate">
                      </div>

                      <!-- Voucher Number -->
                      <div class="col-md-2">
                        <label class="fw-bold"> Voucher No: </label>
                      </div>
                    
                      <div class="col-md-3">
                        <input type="text"
                                  class="form-control form-control-sm"
                                  formControlName="voucherNumber"
                                  readonly>
                      </div>

                    </div>
                    
                    <!-- DR ACCOUNT -->
                    <div class="col-md-12 mb-2">
                      <div class="row align-items-center">

                        <div class="col-md-3">
                          <label class="fw-bold">
                            DR ACCOUNT : <span class="text-danger">*</span>
                          </label>
                        </div>

                        <div class="col-md-6 position-relative">
                          <input
                            type="text"
                            class="form-control"
                            #sourceAccount
                            formControlName="sourceEmployeeName"
                            placeholder="Search Employee"
                            autocomplete="off"
                            (input)="searchSourceEmployee($event)"
                            (keydown)="onSourceEmployeeKeydown($event)"
                          />

                          <ul
                            *ngIf="sourceEmployees.length > 0"
                            class="list-group position-absolute w-100 shadow"
                            style="
                              z-index: 1000;
                              max-height: 200px;
                              overflow-y: auto;
                            "
                          >
                            <li
                              *ngFor="
                                let employee of sourceEmployees;
                                let i = index
                              "
                              class="list-group-item list-group-item-action"
                              [class.active]="
                                i === selectedSourceEmployeeIndex
                              "
                              (mousedown)="selectSourceEmployee(employee)"
                            >
                              {{ employee.employeeFullName }}
                            </li>
                          </ul>
                        </div>

                      </div>
                    </div>

                    <!-- CR ACCOUNT -->
                    <div class="col-md-12 mb-2">
                      <div class="row align-items-center">

                        <div class="col-md-3">
                          <label class="fw-bold">
                            CR ACCOUNT : <span class="text-danger">*</span>
                          </label>
                        </div>

                        <div class="col-md-6 position-relative">
                          <input
                            type="text"
                            class="form-control"
                            #destinationAccount
                            formControlName="destinationEmployeeName"
                            placeholder="Search Employee"
                            autocomplete="off"
                            (input)="searchDestinationEmployee($event)"
                            (keydown)="onDestinationEmployeeKeydown($event)"
                          />

                          <ul
                            *ngIf="destinationEmployees.length > 0"
                            class="list-group position-absolute w-100 shadow"
                            style="
                              z-index: 1000;
                              max-height: 200px;
                              overflow-y: auto;
                            "
                          >
                            <li
                              *ngFor="
                                let employee of destinationEmployees;
                                let i = index
                              "
                              class="list-group-item list-group-item-action"
                              [class.active]="
                                i === selectedDestinationEmployeeIndex
                              "
                              (mousedown)="selectDestinationEmployee(employee)"
                            >
                              {{ employee.employeeFullName }}
                            </li>
                          </ul>
                        </div>

                      </div>
                    </div>

                    <!-- Net Salary -->
                    <!-- <div class="col-md-12 mb-2">
                    <div class="row align-items-center">
                      
                      <div class="col-md-3">
                        <label class="fw-bold">
                          Net Salary : <span class="text-danger">*</span>
                        </label>
                      </div>
                      
                      <div class="col-md-6">
                        <input type="number"                            
                            class="form-control form-control-sm"
                            formControlName="netSalary">
                      </div>   

                    </div>
                    </div> -->

                    <!-- Amount -->
                    <div class="col-md-12 mb-2">
                    <div class="row align-items-center">
                      
                      <div class="col-md-3">
                        <label class="fw-bold">
                          Amount : <span class="text-danger">*</span>
                        </label>
                      </div>
                      
                      <div class="col-md-6">
                        <input type="number"
                            #amount
                            (keydown.enter)="focusNext(narration); $event.preventDefault()"
                            class="form-control form-control-sm"
                            formControlName="amount"
                            placeholder="Enter amount">
                      </div>   

                    </div>
                    </div>
                  
                    <!-- Narration -->
                    <div class="col-md-12 mb-2">
                      <div class="row align-items-center">
                        
                        <div class="col-md-3">
                          <label class="fw-bold">
                            Narration :
                          </label>
                        </div>
                        
                        <div class="col-md-6">
                          <input type="text"
                              #narration                              
                              class="form-control form-control-sm"
                              formControlName="narration"
                              placeholder="Enter Narration">
                        </div>   

                      </div>
                    </div>                                      
                   
                    <!-- Row 3: Created By-->
                    <!-- Narration -->
                    <div class="col-md-12 mb-2">
                      <div class="row align-items-center">
                        
                        <div class="col-md-3">
                          <label class="fw-bold">
                            Created By :
                          </label>
                        </div>
                        
                        <div class="col-md-6">
                          <input type="text"
                              class="form-control form-control-sm"
                              formControlName="createdByName" >
                        </div>   

                      </div>
                    </div>  

                  <!-- SAVE BUTTON -->
                  <div class="col-md-12 mb-2">
                    <div class="row align-items-center">
                      
                      <div class="col-md-8">
                         
                      </div>
                      
                      <div class="col-md-3">
                        <div class="d-grid mt-1">
                          <button type="submit"
                            class="btn btn-primary btn-sm"
                            [disabled]="jvForm.invalid">
                              Save
                            </button>
                        </div>                          
                      </div>   

                    </div>
                  </div>  

                </form>
              </div>

              <!-- ================= RIGHT FORM (APPROVAL) ================= -->
              <div class="col-md-4">               
              </div>

            </div>
          </div>   
      </div>
    </div>
