<div class="container-fluid min-vh-100 d-flex p-0 page-no-top">
  <div class="row g-0 w-100">
    <div class="col-12">
      <div class="card h-100 w-100 rounded-0">

        <!-- Header -->
        <div class="card-header bg-primary text-white d-flex justify-content-between" *ngIf="!isUpdateMode">
          <strong class="h5">Add Employee Information</strong>
        </div>
        <div class="card-header bg-primary text-white d-flex justify-content-between" *ngIf="isUpdateMode">
          <strong class="h5">Update Employee Information</strong>
        </div>

        <div class="card-body">
          <form [formGroup]="employeeForm" (ngSubmit)="onSubmitEmployee()">
                    <div class="row">

                    <!-- Employee Code -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Employee Code</label>
                        <input type="text"
                            class="form-control"
                            formControlName="employeeCode"
                            maxlength="20"
                            placeholder="Enter Employee Code"
                            [ngClass]="{
                            'is-invalid': employeeForm.get('employeeCode')?.invalid && employeeForm.get('employeeCode')?.touched,
                            'readonly-field': isUpdateMode
                            }"
                            [readonly]="isUpdateMode">
                    </div>

                    <!-- First Name -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text"
                            class="form-control"
                            formControlName="firstName"
                            placeholder="Enter First Name"
                            [ngClass]="{'is-invalid': employeeForm.get('firstName')?.invalid && employeeForm.get('firstName')?.touched}">
                    </div>

                    <!-- Middle Name -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Middle Name</label>
                        <input type="text"
                            class="form-control"
                            formControlName="middleName"
                            placeholder="Enter Middle Name"
                            [ngClass]="{'is-invalid': employeeForm.get('middleName')?.invalid && employeeForm.get('middleName')?.touched}">
                    </div>

                    <!-- Last Name -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text"
                            class="form-control"
                            formControlName="lastName"
                            placeholder="Enter Last Name"
                            [ngClass]="{'is-invalid': employeeForm.get('lastName')?.invalid && employeeForm.get('lastName')?.touched}">
                    </div>      

                    <!-- Primary Phone -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Primary Phone</label>
                        <input type="text"
                            class="form-control"
                            formControlName="phonePrimary"
                            placeholder="Enter Primary Phone"
                            [ngClass]="{'is-invalid': employeeForm.get('phonePrimary')?.invalid && employeeForm.get('phonePrimary')?.touched}">
                    </div>

                    <!-- Secondary Phone -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Secondary Phone</label>
                        <input type="text"
                            class="form-control"
                            formControlName="phoneSecondary"
                            placeholder="Enter Secondary Phone"
                            [ngClass]="{'is-invalid': employeeForm.get('phoneSecondary')?.invalid && employeeForm.get('phoneSecondary')?.touched}">
                    </div>   
                    
                    <!-- Email -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                            class="form-control"
                            formControlName="email"
                            placeholder="Enter Email"
                            [ngClass]="{'is-invalid': employeeForm.get('email')?.invalid && employeeForm.get('email')?.touched}">
                    </div>

                    <!-- Local Address -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Local Address</label>
                        <textarea class="form-control"
                                formControlName="localAddress"
                                rows="2"
                                placeholder="Enter Local Address"
                                [ngClass]="{'is-invalid': employeeForm.get('localAddress')?.invalid && employeeForm.get('localAddress')?.touched}"></textarea>
                    </div>

                    <!-- Permanent Address -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Permanent Address</label>
                        <textarea class="form-control"
                                formControlName="permanentAddress"
                                rows="2"
                                placeholder="Enter Permanent Address"
                                [ngClass]="{'is-invalid': employeeForm.get('permanentAddress')?.invalid && employeeForm.get('permanentAddress')?.touched}"></textarea>
                    </div>                   

                    <!-- City -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">City</label>
                        <input type="text"
                            class="form-control"
                            formControlName="city"
                            placeholder="Enter City"
                            [ngClass]="{'is-invalid': employeeForm.get('city')?.invalid && employeeForm.get('city')?.touched}">
                    </div>

                    <!-- State -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">State</label>
                        <select
                        class="form-select"
                        formControlName="stateId">
                        <option value="" disabled>Select State</option>
                        <option *ngFor="let state of states" [value]="state.id">
                            {{ state.code }} - {{ state.name }} (GST Code - {{ state.gstCode }})
                        </option>
                        </select>
                    </div>

                    <!-- Postal Code -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Postal Code</label>
                        <input type="text"
                            class="form-control"
                            formControlName="postalCode"
                            placeholder="Enter Postal Code"
                            [ngClass]="{'is-invalid': employeeForm.get('postalCode')?.invalid && employeeForm.get('postalCode')?.touched}">
                    </div>

                    <!-- Birth Date -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Birth Date</label>
                        <input type="date"
                            class="form-control"
                            formControlName="birthDate"
                            [ngClass]="{'is-invalid': employeeForm.get('birthDate')?.invalid && employeeForm.get('birthDate')?.touched}">
                    </div>

                    <!-- Join Date -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Join Date</label>
                        <input type="date"
                            class="form-control"
                            formControlName="joinDate"
                            [ngClass]="{'is-invalid': employeeForm.get('joinDate')?.invalid && employeeForm.get('joinDate')?.touched}">
                    </div>

                    <!-- Referred By -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Referred By</label>
                        <input type="text"
                            class="form-control"
                            formControlName="referredBy"
                            placeholder="Enter Referrer Name"
                            [ngClass]="{'is-invalid': employeeForm.get('referredBy')?.invalid && employeeForm.get('referredBy')?.touched}">
                    </div>                    

                    <!-- Is Active -->
                    <div class="col-md-2 mb-3 d-flex align-items-center">
                        <div class="form-check mt-4">
                        <input type="checkbox"
                                class="form-check-input"
                                formControlName="isActive">
                        <label class="form-check-label">Active</label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-md-12 text-end">
                        <button type="submit" class="btn btn-primary" [disabled]="employeeForm.invalid">
                        {{ isUpdateMode ? 'Update' : 'Submit' }}
                        </button>
                    </div>

                    </div>
          </form>          
        </div>

      </div>
    </div>
  </div>
</div>
