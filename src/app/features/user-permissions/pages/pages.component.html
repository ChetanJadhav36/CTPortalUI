<div class="container-fluid min-vh-100 d-flex p-0">

  <div class="row g-0 w-100">
    <div class="col-12">

      <div class="card h-100 w-100 rounded-0">

        <div class="card-header bg-primary text-white d-flex justify-content-between">

          <strong>Pages</strong>

          <button
            type="button"
            class="btn btn-light"
            (click)="onAddNewPage()">
            Add Page
          </button>

        </div>

        <div class="card-body">

          <p-table
            [value]="pages"
            [paginator]="true"
            [rows]="20"
            [rowsPerPageOptions]="[20,50,100]"
            showGridlines="true"
            sortMode="multiple"
            paginatorStyleClass="custom-paginator">

            <!-- HEADER -->
            <ng-template pTemplate="header">

              <tr>
                <th pSortableColumn="pageCode"> Page Code <p-sortIcon field="pageCode"></p-sortIcon> </th>
                <th pSortableColumn="pageName"> Page Name <p-sortIcon field="pageName"></p-sortIcon> </th>                                
                <th>Action</th>
              </tr>

            </ng-template>

            <!-- BODY -->
            <ng-template pTemplate="body" let-page>

              <tr>
                <td>{{ page.pageCode }}</td>
                <td>{{ page.pageName }}</td>                                                
                 <td>                               
                <button type="button" class="btn btn-link p-0 edit-btn" (click)="onEditPage(page.id)">
                  <svg cIcon name="cilPencil"></svg>
                </button>
              </td>
              </tr>

            </ng-template>

          </p-table>

        </div>

      </div>

    </div>
  </div>

</div>
