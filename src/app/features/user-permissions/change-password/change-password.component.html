<div class="container-fluid min-vh-100 d-flex p-0 page-no-top">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="6" md="8">
        <c-card>
          <c-card-body>

            <form cForm [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">

              <h2>Change Password</h2>
              <p class="text-body-secondary">
                Update your account password
              </p>

              <!-- Current Password -->
              <c-input-group class="mb-3">
                <span cInputGroupText>
                  <svg cIcon name="cilLockLocked"></svg>
                </span>
                <input
                  cFormControl
                  type="password"
                  placeholder="Current Password"
                  formControlName="oldPassword" />
              </c-input-group>

              <!-- New Password -->
              <c-input-group class="mb-3">
                <span cInputGroupText>
                  <svg cIcon name="cilLockLocked"></svg>
                </span>
                <input
                  cFormControl
                  type="password"
                  placeholder="New Password"
                  formControlName="newPassword" />
              </c-input-group>

              <!-- Confirm Password -->
              <c-input-group class="mb-4">
                <span cInputGroupText>
                  <svg cIcon name="cilLockLocked"></svg>
                </span>
                <input
                  cFormControl
                  type="password"
                  placeholder="Confirm New Password"
                  formControlName="confirmPassword" />
              </c-input-group>

              <div class="d-grid">
                <button
                  cButton
                  color="primary"
                  type="submit"
                  [disabled]="changePasswordForm.invalid">
                  Change Password
                </button>
              </div>

            </form>

          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
