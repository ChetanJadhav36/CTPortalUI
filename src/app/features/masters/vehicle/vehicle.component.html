<div class="container-fluid min-vh-100 d-flex p-0">
  <div class="row g-0 w-100">
    <div class="col-12">

      <div class="card h-100 w-100 rounded-0">

        <div class="card-header bg-primary text-white d-flex justify-content-between" *ngIf="!isUpdateMode">
          <strong class="h5">Add Vehicle Information</strong>
        </div>

        <div class="card-header bg-primary text-white d-flex justify-content-between" *ngIf="isUpdateMode">
          <strong class="h5">Update Vehicle Information</strong>
        </div>

        <div class="card-body">
          <form [formGroup]="myForm" (ngSubmit)="onSubmitVehicle()">

            <!-- ✅ IMPORTANT: Add row here -->
            <div class="row">

              <!-- Vehicle Code -->
              <div class="col-lg-4 col-md-6 col-12 mb-3">
                <label for="code" class="form-label">Vehicle Code</label>
                <input type="text" class="form-control"
                  id="code" formControlName="code"
                  placeholder="Enter Vehicle Code" maxlength="20">
              </div>

              <!-- Vehicle Name -->
              <div class="col-lg-4 col-md-6 col-12 mb-3">
                <label for="name" class="form-label">Vehicle Name</label>
                <input type="text" class="form-control"
                  id="name" formControlName="name"
                  placeholder="Enter Vehicle Name">
              </div>

              <!-- Vehicle Number -->
              <div class="col-lg-4 col-md-6 col-12 mb-3">
                <label for="vehicleNumber" class="form-label">Vehicle Number</label>
                <input type="text" class="form-control"
                  id="vehicleNumber" formControlName="vehicleNumber"
                  placeholder="Enter Vehicle Number">
              </div>

              <!-- Vehicle Type -->
              <div class="col-lg-4 col-md-6 col-12 mb-3">
                <label for="vType" class="form-label">Vehicle Type</label>
                <input type="text" class="form-control"
                  id="vType" formControlName="vType"
                  placeholder="Enter Vehicle Type">
              </div>

              <!-- Driver Name -->
              <div class="col-lg-4 col-md-6 col-12 mb-3 position-relative">
                <label for="driverName" class="form-label">Driver Name</label>

                <input type="text"
                      class="form-control"
                      id="employeeId"
                      formControlName="employeeFullName"
                      placeholder="Enter Driver Name"
                      (input)="searchDriver($event)"
                  autocomplete="off">

            <!-- Autocomplete Dropdown -->
            <ul *ngIf="drivers.length > 0"
                class="list-group position-absolute w-100 shadow"
                style="z-index:1000; max-height:200px; overflow-y:auto">

              <li class="list-group-item list-group-item-action"
                  *ngFor="let driver of drivers"
                  (click)="selectDriver(driver)">
                  {{driver.employeeFullName}}
              </li>

            </ul>
              </div>            
              
              <!-- Vehicle Average -->
              <div class="col-lg-4 col-md-6 col-12 mb-3">
                <label for="vAvg" class="form-label">Vehicle Average</label>
                <input type="number" class="form-control"
                  id="vAvg" formControlName="vAvg"
                  placeholder="Enter Vehicle Average">
              </div>

              <!-- Rate -->
              <div class="col-lg-4 col-md-6 col-12 mb-3">
                <label for="rate" class="form-label">Rate</label>
                <input type="number" class="form-control"
                  id="rate" formControlName="rate"
                  placeholder="Enter Rate">
              </div>

              <!-- Status -->
              <div class="col-lg-4 col-md-6 col-12 mb-3">
                <label class="form-label d-block">Status</label>
                <div class="form-check mt-2">
                  <input class="form-check-input"
                    type="checkbox"
                    id="isActive"
                    formControlName="isActive">
                  <label class="form-check-label" for="isActive">
                    Active
                  </label>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="col-12 text-end">
                <button type="submit" class="btn btn-primary px-4">
                  Submit
                </button>
              </div>

            </div>
            <!-- End row -->

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
