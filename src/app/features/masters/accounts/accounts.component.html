<div class="container-fluid min-vh-100 d-flex p-0">

  <div class="row g-0 w-100">
    <div class="col-12">

      <div class="card h-100 w-100 rounded-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between">
          <strong class="h5">Accounts</strong>
          
           <button type="button" class="btn btn-light">
                    <a cDropdownItem (click)="onAddNewAccount()">
                    <svg cIcon class="me-2" name="cilUserFollow"></svg>
                    Add New
                  </a>
            </button>
        </div>

        <div class="card-body">                
          <p-table [value]="accounts"
            [paginator]="true"
            [rows]="20"
            [rowsPerPageOptions]="[20,50,100]"
            showGridlines="true"
            sortMode="multiple"
            paginatorStyleClass="custom-paginator">
          <ng-template pTemplate="header">
            <tr>              
              <th pSortableColumn="accountCode">
                Account Code <p-sortIcon field="accountCode"></p-sortIcon>
              </th>
              <th pSortableColumn="accountName">
                Account Name <p-sortIcon field="accountName"></p-sortIcon>
              </th>
              <th pSortableColumn="accountGroupCode">
                Account Group Code <p-sortIcon field="accountGroupCode"></p-sortIcon>
              </th>
              <th pSortableColumn="accountGroupName">
                Account Group Name <p-sortIcon field="accountGroupName"></p-sortIcon>
              </th>              
               <th pSortableColumn="openingBal">
                Opening Bal <p-sortIcon field="openingBal"></p-sortIcon>
              </th>              
               <th pSortableColumn="netBal">
                Net Bal <p-sortIcon field="netBal"></p-sortIcon>
              </th>              
              <th>Action</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-account>
            <tr>
              <td>{{ account.accountCode }}</td>
              <td>{{ account.accountName }}</td>
              <td>{{ account.accountGroupCode }}</td>
              <td>{{ account.accountGroupName }}</td>              
              <td>{{ account.openingBal }}</td>              
              <td>{{ account.netBal }}</td>              
              <td>                               
                <button type="button" 
                  class="btn btn-link p-0 edit-btn" 
                  (click)="onEdit(account.id)">
                  <svg cIcon name="cilPencil"></svg>
                </button>
              </td>
            </tr>
          </ng-template>
          </p-table>
        </div>
      </div>

    </div>
  </div>

</div>
