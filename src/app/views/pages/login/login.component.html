<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <h1>Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input autoComplete="username" formControlName="email" type="email" cFormControl placeholder="Username" />
                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    formControlName="password"
                    autoComplete="current-password"
                    cFormControl
                    placeholder="Password"
                    type="password"
                  />
                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLayers"></svg>
                  </span>
                  <input
                    formControlName="companyCode"
                    autoComplete="current-password"
                    cFormControl
                    placeholder="Client Code"
                    type="text"
                  />
                </c-input-group>
                <c-row>
                  <c-col xs="6">
                    <button cButton type="submit" [disabled]="loginForm.invalid" class="px-4" color="primary">
                      Login
                    </button>
                  </c-col>
                  <c-col class="text-end" xs="6">
                    <button cButton class="px-0" color="link">
                      Forgot password?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                  <h2 class="fw-bold d-flex align-items-center">
                    <span class="me-2">💰</span>
                    CT Portal
                    <span class="ms-2">📊</span>
                  </h2>
                  
                  <div class="d-flex flex-column">

                      <div class="d-flex align-items-center">
                        <p>💰 Cash Management</p>
                      </div>

                      <div class="d-flex align-items-center">
                        <p>👥 Employee Management</p>
                      </div>

                      <div class="d-flex align-items-center">
                        <p>💵 Salary &amp; Payroll</p>
                      </div>

                      <div class="d-flex align-items-center">
                        <p>🕐 Attendance</p>
                      </div>

                      <div class="d-flex align-items-center">
                        <p>📊 Financial Reports</p>
                      </div>

                      <div class="d-flex align-items-center">
                        <p>📋 Expenses &amp; Transactions</p>
                      </div>

                  </div>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
